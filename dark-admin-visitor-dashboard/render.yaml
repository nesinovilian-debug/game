services:
  - type: web
    name: dark-admin-visitor-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: visitor-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_FILE
        value: /opt/render/project/src/data/visitors.db
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
